{% extends "base.html" %}
{% from "macros/utils.html" import page_header %}
{% block title %}ارسال دستی اعلان{% endblock %}
{% block content %}
{{ page_header("ارسال دستی اعلان") }}

<div class="form-card">
    <form method="post">
        <div class="form-group">
            <label for="title" class="form-label">عنوان:</label>
            <input type="text" id="title" name="title" class="form-input" required>
        </div>
        <div class="form-group">
            <label for="message" class="form-label">پیام:</label>
            <textarea id="message" name="message" class="form-textarea" rows="4" required></textarea>
        </div>
        <div class="form-group">
            <label for="channel" class="form-label">کانال:</label>
            <select id="channel" name="channel" class="form-select" required>
                <option value="IN_APP">درون‌برنامه‌ای</option>
                <option value="SMS">پیامک</option>
                <option value="TELEGRAM">تلگرام</option>
                <option value="BALE">بله</option>
                <option value="EMAIL">ایمیل</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">گیرندگان:</label>
            <div class="form-grid">
                {% for user in users %}
                <label class="form-checkbox-label">
                    <input type="checkbox" name="recipients" value="{{ user.id }}">
                    {{ user.login }}
                </label>
                {% endfor %}
            </div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">ارسال</button>
            <a href="{{ url_for('notification.admin_dashboard') }}" class="btn btn-secondary">لغو</a>
        </div>
    </form>
</div>
{% endblock %}
