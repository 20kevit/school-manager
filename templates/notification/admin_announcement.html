{% extends "base.html" %}
{% from "macros/utils.html" import page_header %}
{% block title %}ارسال اطلاع‌رسانی{% endblock %}
{% block content %}
{{ page_header("ارسال اطلاع‌رسانی") }}

<div class="form-card">
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="title" class="form-label">عنوان:</label>
            <input type="text" id="title" name="title" class="form-input" required>
        </div>
        <div class="form-group">
            <label for="message" class="form-label">پیام:</label>
            <textarea id="message" name="message" class="form-textarea" rows="4" required></textarea>
        </div>
        <div class="form-group">
            <label class="form-label">کانال‌ها:</label>
            <div class="form-grid">
                <label class="form-checkbox-label"><input type="checkbox" name="channels" value="IN_APP"> درون‌برنامه‌ای</label>
                <label class="form-checkbox-label"><input type="checkbox" name="channels" value="SMS"> پیامک</label>
                <label class="form-checkbox-label"><input type="checkbox" name="channels" value="TELEGRAM"> تلگرام</label>
                <label class="form-checkbox-label"><input type="checkbox" name="channels" value="BALE"> بله</label>
                <label class="form-checkbox-label"><input type="checkbox" name="channels" value="EMAIL"> ایمیل</label>
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">گیرندگان:</label>
            <div class="form-grid">
                {% for user in users %}
                <label class="form-checkbox-label">
                    <input type="checkbox" name="recipients" value="{{ user.id }}">
                    {{ user.login }}
                </label>
                {% endfor %}
            </div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">ارسال</button>
            <a href="{{ url_for('notification.admin_dashboard') }}" class="btn btn-secondary">لغو</a>
        </div>
    </form>
</div>
{% endblock %}
