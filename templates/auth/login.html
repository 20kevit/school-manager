{% extends "base.html" %}

{% block title %}ورود - آکادمی{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="brand">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--color-primary); margin-bottom: 0.5rem;"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
            <h1>ورود به آکادمی</h1>
            <p>برای ادامه وارد حساب کاربری خود شوید</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label class="form-label" for="login">نام کاربری</label>
                <input type="text" id="login" name="login" required autocomplete="username"
                       class="form-input" placeholder="کد ملی یا نام کاربری خود را وارد کنید">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">رمز عبور</label>
                <input type="password" id="password" name="password" required autocomplete="current-password"
                       class="form-input" placeholder="رمز عبور خود را وارد کنید">
            </div>

            <div class="form-group">
                <label class="form-check">
                    <input type="checkbox" name="remember" value="1">
                    <span>مرا به خاطر بسپار</span>
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">ورود</button>
        </form>

        <div class="auth-links">
            <p class="text-muted text-sm" style="margin-bottom: 0;">دانش‌آموزان: از کد ملی به عنوان نام کاربری و رمز عبور استفاده کنید.</p>
        </div>
    </div>
</div>
{% endblock %}
