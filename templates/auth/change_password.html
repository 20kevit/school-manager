{% extends "base.html" %}

{% block title %}تغییر رمز عبور - آکادمی{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="brand">
            <h1>تغییر رمز عبور</h1>
            <p>رمز عبور خود را به روز کنید</p>
        </div>

        <form method="POST" action="{{ url_for('auth.change_password_view') }}" class="auth-form">
            <div class="form-group">
                <label class="form-label" for="current_password">رمز عبور فعلی</label>
                <input type="password" id="current_password" name="current_password" required
                       autocomplete="current-password" class="form-input"
                       placeholder="رمز عبور فعلی خود را وارد کنید">
            </div>

            <div class="form-group">
                <label class="form-label" for="new_password">رمز عبور جدید</label>
                <input type="password" id="new_password" name="new_password" required
                       autocomplete="new-password" class="form-input"
                       placeholder="حداقل ۶ کاراکتر">
            </div>

            <div class="form-group">
                <label class="form-label" for="confirm_password">تأیید رمز عبور جدید</label>
                <input type="password" id="confirm_password" name="confirm_password" required
                       autocomplete="new-password" class="form-input"
                       placeholder="رمز عبور جدید را دوباره وارد کنید">
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">تغییر رمز عبور</button>
        </form>

        <div class="auth-links">
            <a href="{{ url_for('auth.dashboard') }}">بازگشت به داشبورد</a>
        </div>
    </div>
</div>
{% endblock %}
