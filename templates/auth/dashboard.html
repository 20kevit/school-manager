{% extends "base.html" %}

{% block title %}داشبورد - آکادمی{% endblock %}

{% block content %}
{% from "macros/utils.html" import page_header %}
{{ page_header("داشبورد") }}

<div class="dashboard-grid" style="margin-top: var(--space-6);">
    <div class="stat-card">
        <div class="stat-card-header">
            <span class="stat-card-label">نقش شما</span>
        </div>
        <div class="stat-card-value" style="font-size: var(--font-size-lg);">
            {% for role in current_user.roles %}
                <span class="badge badge-primary">{{ role.name }}</span>
            {% endfor %}
        </div>
    </div>
</div>

<div class="action-links">
    <a href="{{ url_for('auth.change_password_view') }}" class="btn btn-secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        تغییر رمز عبور
    </a>
    <form method="POST" action="{{ url_for('auth.logout') }}" class="inline-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="btn btn-ghost">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        خروج
        </button>
    </form>
</div>
{% endblock %}
