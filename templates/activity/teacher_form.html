{% extends "base.html" %}
{% block title %}ایجاد فعالیت - {{ academy_class.title }}{% endblock %}
{% block content %}
{% from "macros/utils.html" import page_header %}
{{ page_header("ایجاد فعالیت جدید برای " ~ academy_class.title) }}

<div class="form-card">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="title">عنوان</label>
            <input type="text" id="title" name="title" class="form-input" required>
        </div>
        <div class="form-group">
            <label for="type">نوع</label>
            <select id="type" name="type" class="form-select">
                <option value="HOMEWORK">تکلیف</option>
                <option value="PROJECT">پروژه</option>
                <option value="PRACTICE">تمرین</option>
                <option value="QUIZ">آزمون کوچک</option>
                <option value="EXAM">امتحان</option>
            </select>
        </div>
        <div class="form-group">
            <label for="description">توضیحات</label>
            <textarea id="description" name="description" class="form-textarea" rows="4"></textarea>
        </div>
        <div class="form-group">
            <label for="requirement">الزامی/اختیاری</label>
            <select id="requirement" name="requirement" class="form-select">
                <option value="REQUIRED">الزامی</option>
                <option value="OPTIONAL">اختیاری</option>
            </select>
        </div>
        <div class="form-group">
            <label for="max_score">حداکثر امتیاز</label>
            <input type="number" id="max_score" name="max_score" class="form-input" value="100" min="0" step="0.5">
        </div>
        <div class="form-group">
            <label for="deadline">مهلت تحویل (اختیاری)</label>
            <input type="datetime-local" id="deadline" name="deadline" class="form-input">
        </div>
        <div class="form-group">
            <label for="sort_order">ترتیب نمایش</label>
            <input type="number" id="sort_order" name="sort_order" class="form-input" value="0" min="0">
        </div>
        <div class="form-group">
            <label for="session_id">جلسه (اختیاری)</label>
            <select id="session_id" name="session_id" class="form-select">
                <option value="">بدون جلسه</option>
                {% for s in sessions %}
                <option value="{{ s.id }}">جلسه {{ s.session_number }} - {{ s.title or '' }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">ایجاد فعالیت</button>
            <a href="{{ url_for('activity.teacher_class_activities', class_id=academy_class.id) }}" class="btn btn-secondary">انصراف</a>
        </div>
    </form>
</div>
{% endblock %}
