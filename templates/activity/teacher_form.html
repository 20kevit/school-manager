{% extends "base.html" %}
{% block title %}ایجاد فعالیت - {{ academy_class.title }}{% endblock %}
{% block content %}
<h1>ایجاد فعالیت جدید برای {{ academy_class.title }}</h1>

<form method="POST">
    <div>
        <label>عنوان:</label>
        <input type="text" name="title" required>
    </div>
    <div>
        <label>نوع:</label>
        <select name="type">
            <option value="HOMEWORK">تکلیف</option>
            <option value="PROJECT">پروژه</option>
            <option value="PRACTICE">تمرین</option>
            <option value="QUIZ">آزمون کوچک</option>
            <option value="EXAM">امتحان</option>
        </select>
    </div>
    <div>
        <label>توضیحات:</label>
        <textarea name="description" rows="4"></textarea>
    </div>
    <div>
        <label>الزامی/اختیاری:</label>
        <select name="requirement">
            <option value="REQUIRED">الزامی</option>
            <option value="OPTIONAL">اختیاری</option>
        </select>
    </div>
    <div>
        <label>حداکثر امتیاز:</label>
        <input type="number" name="max_score" value="100" min="0" step="0.5">
    </div>
    <div>
        <label>مهلت تحویل (اختیاری):</label>
        <input type="datetime-local" name="deadline">
    </div>
    <div>
        <label>ترتیب نمایش:</label>
        <input type="number" name="sort_order" value="0" min="0">
    </div>
    <div>
        <label>جلسه (اختیاری):</label>
        <select name="session_id">
            <option value="">بدون جلسه</option>
            {% for s in sessions %}
            <option value="{{ s.id }}">جلسه {{ s.session_number }} - {{ s.title or '' }}</option>
            {% endfor %}
        </select>
    </div>
    <div>
        <button type="submit">ایجاد فعالیت</button>
        <a href="{{ url_for('activity.teacher_class_activities', class_id=academy_class.id) }}">انصراف</a>
    </div>
</form>
{% endblock %}
