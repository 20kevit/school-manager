{% extends "base.html" %}
{% block title %}Create Assessment{% endblock %}
{% block content %}
<h1>Create Assessment</h1>

<form method="POST">
    <div class="form-group">
        <label for="class_id">Class *</label>
        <select name="class_id" id="class_id" required>
            {% for c in classes %}
            <option value="{{ c.id }}">{{ c.title }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="assessment_type">Type *</label>
        <select name="assessment_type" id="assessment_type" required>
            {% for t in ['FINAL_EXAM', 'MIDTERM', 'QUIZ', 'PROJECT', 'PRACTICAL', 'ORAL', 'OTHER'] %}
            <option value="{{ t }}">{{ t }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="title">Title *</label>
        <input type="text" name="title" id="title" required>
    </div>

    <div class="form-group">
        <label for="description">Description</label>
        <textarea name="description" id="description" rows="3"></textarea>
    </div>

    <div class="form-group">
        <label for="scheduled_date">Scheduled Date</label>
        <input type="date" name="scheduled_date" id="scheduled_date">
    </div>

    <div class="form-group">
        <label for="scheduled_time">Scheduled Time</label>
        <input type="datetime-local" name="scheduled_time" id="scheduled_time">
    </div>

    <div class="form-group">
        <label for="duration_minutes">Duration (minutes)</label>
        <input type="number" name="duration_minutes" id="duration_minutes" min="1">
    </div>

    <div class="form-group">
        <label for="max_score">Maximum Score</label>
        <input type="number" name="max_score" id="max_score" value="100" min="1" step="0.01">
    </div>

    <div class="form-group">
        <label for="passing_score">Passing Score</label>
        <input type="number" name="passing_score" id="passing_score" value="60" min="0" step="0.01">
    </div>

    <div class="form-group">
        <label for="status">Status</label>
        <select name="status" id="status">
            {% for s in ['DRAFT', 'SCHEDULED', 'OPEN', 'CLOSED', 'GRADED'] %}
            <option value="{{ s }}" {% if s == 'DRAFT' %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="notes">Notes</label>
        <textarea name="notes" id="notes" rows="2"></textarea>
    </div>

    <button type="submit" class="btn">Create Assessment</button>
    <a href="{{ url_for('assessment.admin_assessment_list') }}">Cancel</a>
</form>
{% endblock %}
