{% extends "base.html" %}
{% block title %}Edit Assessment - {{ assessment.title }}{% endblock %}
{% block content %}
<h1>Edit Assessment</h1>

<form method="POST">
    <div class="form-group">
        <label for="title">Title *</label>
        <input type="text" name="title" id="title" value="{{ assessment.title }}" required>
    </div>

    <div class="form-group">
        <label for="description">Description</label>
        <textarea name="description" id="description" rows="3">{{ assessment.description }}</textarea>
    </div>

    <div class="form-group">
        <label for="scheduled_date">Scheduled Date</label>
        <input type="date" name="scheduled_date" id="scheduled_date" value="{{ assessment.scheduled_date or '' }}">
    </div>

    <div class="form-group">
        <label for="scheduled_time">Scheduled Time</label>
        <input type="datetime-local" name="scheduled_time" id="scheduled_time" value="{{ assessment.scheduled_time.strftime('%Y-%m-%dT%H:%M') if assessment.scheduled_time else '' }}">
    </div>

    <div class="form-group">
        <label for="duration_minutes">Duration (minutes)</label>
        <input type="number" name="duration_minutes" id="duration_minutes" value="{{ assessment.duration_minutes or '' }}" min="1">
    </div>

    <div class="form-group">
        <label for="max_score">Maximum Score</label>
        <input type="number" name="max_score" id="max_score" value="{{ assessment.max_score }}" min="1" step="0.01">
    </div>

    <div class="form-group">
        <label for="passing_score">Passing Score</label>
        <input type="number" name="passing_score" id="passing_score" value="{{ assessment.passing_score }}" min="0" step="0.01">
    </div>

    <div class="form-group">
        <label for="notes">Notes</label>
        <textarea name="notes" id="notes" rows="2">{{ assessment.notes }}</textarea>
    </div>

    <button type="submit" class="btn">Save Changes</button>
    <a href="{{ url_for('assessment.admin_assessment_detail', assessment_id=assessment.id) }}">Cancel</a>
</form>
{% endblock %}
