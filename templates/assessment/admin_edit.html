{% extends "base.html" %}
{% block title %}ویرایش ارزیابی - {{ assessment.title }}{% endblock %}
{% block content %}
{% from "macros/utils.html" import page_header %}
{{ page_header("ویرایش ارزیابی") }}

<div class="form-card">
    <form method="POST">
        <div class="form-grid">
            <div class="form-group">
                <label class="form-label" for="title">عنوان <span class="required">*</span></label>
                <input type="text" name="title" id="title" class="form-input" value="{{ assessment.title }}" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="description">توضیحات</label>
                <textarea name="description" id="description" class="form-textarea" rows="3">{{ assessment.description }}</textarea>
            </div>

            <div class="form-group">
                <label class="form-label" for="scheduled_date">تاریخ برنامه‌ریزی شده</label>
                <input type="date" name="scheduled_date" id="scheduled_date" class="form-input" value="{{ assessment.scheduled_date or '' }}">
            </div>

            <div class="form-group">
                <label class="form-label" for="scheduled_time">زمان برنامه‌ریزی شده</label>
                <input type="datetime-local" name="scheduled_time" id="scheduled_time" class="form-input" value="{{ assessment.scheduled_time.strftime('%Y-%m-%dT%H:%M') if assessment.scheduled_time else '' }}">
            </div>

            <div class="form-group">
                <label class="form-label" for="duration_minutes">مدت زمان (دقیقه)</label>
                <input type="number" name="duration_minutes" id="duration_minutes" class="form-input" value="{{ assessment.duration_minutes or '' }}" min="1">
            </div>

            <div class="form-group">
                <label class="form-label" for="max_score">حداکثر نمره</label>
                <input type="number" name="max_score" id="max_score" class="form-input" value="{{ assessment.max_score }}" min="1" step="0.01">
            </div>

            <div class="form-group">
                <label class="form-label" for="passing_score">نمره قبولی</label>
                <input type="number" name="passing_score" id="passing_score" class="form-input" value="{{ assessment.passing_score }}" min="0" step="0.01">
            </div>

            <div class="form-group" style="grid-column: 1 / -1;">
                <label class="form-label" for="notes">یادداشت‌ها</label>
                <textarea name="notes" id="notes" class="form-textarea" rows="2">{{ assessment.notes }}</textarea>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">ذخیره تغییرات</button>
            <a href="{{ url_for('assessment.admin_assessment_detail', assessment_id=assessment.id) }}" class="btn btn-secondary">انصراف</a>
        </div>
    </form>
</div>
{% endblock %}
