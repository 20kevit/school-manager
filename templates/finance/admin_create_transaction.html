{% extends "base.html" %}
{% from "macros/utils.html" import page_header %}
{% block title %}ثبت تراکنش جدید{% endblock %}
{% block content %}
{{ page_header("ثبت تراکنش جدید") }}

<form method="POST" class="form-card">
    <div class="form-group">
        <label class="form-label" for="student_user_id">دانش‌آموز</label>
        <select class="form-select" id="student_user_id" name="student_user_id" required>
            <option value="">انتخاب کنید</option>
            {% for student in students %}
            <option value="{{ student.id }}">{{ student.login }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label class="form-label" for="transaction_type">نوع تراکنش</label>
        <select class="form-select" id="transaction_type" name="transaction_type" required>
            <option value="">انتخاب کنید</option>
            <option value="PAYMENT">پرداخت</option>
            <option value="CHARGE">شارژ</option>
            <option value="REFUND">بازپرداخت</option>
            <option value="DISCOUNT">تخفیف</option>
            <option value="ADJUSTMENT">تعدیل</option>
        </select>
    </div>

    <div class="form-group">
        <label class="form-label" for="amount">مبلغ (تومان)</label>
        <input class="form-input" type="number" id="amount" name="amount" step="0.01" min="0.01" required>
    </div>

    <div class="form-group">
        <label class="form-label" for="category">دسته‌بندی</label>
        <select class="form-select" id="category" name="category">
            <option value="TUITION">شهریه</option>
            <option value="BOOK">کتاب</option>
            <option value="EQUIPMENT">تجهیزات</option>
            <option value="EXAM">آزمون</option>
            <option value="OTHER">سایر</option>
        </select>
    </div>

    <div class="form-group">
        <label class="form-label" for="payment_method">روش پرداخت</label>
        <select class="form-select" id="payment_method" name="payment_method">
            <option value="CASH">نقدی</option>
            <option value="CARD">کارت</option>
            <option value="BANK_TRANSFER">انتقال بانکی</option>
            <option value="ONLINE">آنلاین</option>
            <option value="OTHER">سایر</option>
        </select>
    </div>

    <div class="form-group">
        <label class="form-label" for="class_id">کلاس (اختیاری)</label>
        <select class="form-select" id="class_id" name="class_id">
            <option value="">بدون کلاس</option>
            {% for cls in classes %}
            <option value="{{ cls.id }}">{{ cls.title }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label class="form-label" for="description">توضیحات</label>
        <textarea class="form-textarea" id="description" name="description" rows="3"></textarea>
    </div>

    <div class="form-group">
        <label class="form-label" for="reference_number">شماره مرجع</label>
        <input class="form-input" type="text" id="reference_number" name="reference_number">
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">ثبت تراکنش</button>
    </div>
</form>
{% endblock %}
